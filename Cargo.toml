[package]
name = "miniml"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
inkwell = { version = "0.11.0", default-features = false, features = ["llvm21-1-prefer-dynamic", "target-x86", "target-aarch64"] }
miette = { version = "7.6.0", features = ["derive", "fancy"] }
thiserror = "2.0.21"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
struct_excessive_bools = "allow"
